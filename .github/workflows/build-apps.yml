name: Build apps

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libssl-dev libprotobuf-dev protobuf-compiler
      - name: Configure release build
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DGD_VIEWER=ON -DGD_MULTIPLAYER=ON -DBUILD_TESTING=OFF
      - name: Build all three apps
        run: >-
          cmake --build build --parallel 2
          --target godollo_viewer godollo_server godollo_client
      - name: Archive binaries
        run: >-
          tar -czf build/godollo-apps-linux-x86_64.tar.gz -C build
          godollo_viewer multiplayer/godollo_server multiplayer/godollo_client
      - name: Upload build outputs
        uses: actions/upload-artifact@v7
        with:
          name: godollo-apps-linux-x86_64
          path: build/godollo-apps-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14
