name: Build apps

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libssl-dev libprotobuf-dev protobuf-compiler xvfb xauth libgl1-mesa-dri
      - name: Configure release build
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DGD_VIEWER=ON -DGD_MULTIPLAYER=ON -DBUILD_TESTING=OFF
      - name: Build all three apps
        run: >-
          cmake --build build --parallel 2
          --target godollo_viewer godollo_server godollo_client
      - name: Archive binaries
        run: >-
          tar -czf build/godollo-apps-linux-x86_64.tar.gz -C build
          godollo_viewer multiplayer/godollo_server multiplayer/godollo_client
      - name: Package Linux multiplayer client
        run: cmake -P multiplayer/linux/package.cmake
      - name: Check relocated Linux client package
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: >-
          xvfb-run -a -s '-screen 0 1280x720x24'
          python multiplayer/tests/linux_package.py build/multiplayer/godollo_server
          build/godollo-client-linux-x86_64.tar.gz --graphics
      - name: Upload build outputs
        uses: actions/upload-artifact@v7
        with:
          name: godollo-apps-linux-x86_64
          path: build/godollo-apps-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Upload Linux client package
        uses: actions/upload-artifact@v7
        with:
          name: godollo-client-linux-x86_64
          path: build/godollo-client-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

  windows-client:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: c52f7bd748185ef0e0daf033d9f2ddfc8a3449ea
          path: build/vcpkg
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install CMake
        # Keep the older pinned dependency projects on the CMake 3 policy rules.
        run: python -m pip install cmake==3.31.6
      - name: Bootstrap Windows dependencies
        run: ./build/vcpkg/bootstrap-vcpkg.bat -disableMetrics
      - name: Configure Windows client
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/build/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_MANIFEST_DIR="${{ github.workspace }}/multiplayer/windows"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DVCPKG_HOST_TRIPLET=x64-windows-static-md
          -DOPENSSL_USE_STATIC_LIBS=ON -DProtobuf_USE_STATIC_LIBS=ON
          -DGD_VIEWER=ON -DGD_MULTIPLAYER=ON -DBUILD_TESTING=ON
      - name: Build Windows client
        run: cmake --build build --config Release --parallel 2 --target godollo_client viewer_test_asset test_scene_fingerprint
      - name: Check cross-platform scene fingerprint
        run: ctest --test-dir build -C Release -R '^multiplayer_fingerprint$' --output-on-failure --no-tests=error
      - name: Check executable startup
        run: ./build/multiplayer/Release/godollo_client.exe --help
      - name: Package Windows client
        shell: pwsh
        run: |
          $package = 'build/windows-client'
          New-Item -ItemType Directory -Force "$package/assets", "$package/multiplayer/client", "$package/licenses"
          Copy-Item build/multiplayer/Release/godollo_client.exe $package
          Copy-Item shaders, items, credits $package -Recurse
          Copy-Item inventory.toml $package
          Copy-Item assets/test.glb "$package/assets"
          Copy-Item build/assets/weapons "$package/assets" -Recurse
          Copy-Item assets/weapons/README.md "$package/assets/weapons"
          Copy-Item build/audio "$package/assets" -Recurse
          $openal = Get-ChildItem build/_deps/openal_soft-build -Recurse -Filter OpenAL32.dll | Select-Object -First 1
          if (-not $openal) { throw 'Missing OpenAL32.dll' }
          Copy-Item $openal.FullName $package
          Copy-Item multiplayer/client/players.vert, multiplayer/client/players.frag "$package/multiplayer/client"
          Copy-Item multiplayer/windows/README.md "$package/README.md"
          Get-ChildItem build/vcpkg_installed/x64-windows-static-md/share/*/copyright | ForEach-Object {
            Copy-Item $_.FullName "$package/licenses/$($_.Directory.Name).txt"
          }
          Copy-Item build/_deps/gamenetworkingsockets-src/LICENSE "$package/licenses/GameNetworkingSockets.txt"
          Copy-Item build/_deps/glfw-src/LICENSE.md "$package/licenses/GLFW.txt"
          Copy-Item build/_deps/glm-src/copying.txt "$package/licenses/GLM.txt"
          Copy-Item build/_deps/box3d-src/LICENSE "$package/licenses/Box3D.txt"
          Copy-Item build/_deps/tinygltf-src/LICENSE "$package/licenses/tinygltf.txt"
          Copy-Item build/_deps/tomlplusplus-src/LICENSE "$package/licenses/tomlplusplus.txt"
          Copy-Item build/_deps/openal_soft-src/COPYING "$package/licenses/OpenAL.txt"
          Copy-Item build/_deps/openal_soft-src/LICENSE-pffft "$package/licenses/OpenAL-pffft.txt"
          Copy-Item build/_deps/openal_soft-src/fmt-11.1.1/LICENSE "$package/licenses/OpenAL-fmt.txt"
          Copy-Item credits/software/nlohmann-json.txt, credits/software/stb.txt "$package/licenses"
          Compress-Archive -Path "$package/*" -DestinationPath build/godollo-client-windows-x86_64.zip
      - name: Upload Windows client
        uses: actions/upload-artifact@v7
        with:
          name: godollo-client-windows-x86_64
          path: build/godollo-client-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14
