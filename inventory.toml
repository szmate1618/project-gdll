# Starting inventory. [weapons] values are loaded rounds; omit a weapon to
# remove ownership. Reserves are additional rounds, separate from magazines.
equipped = "pistol"

[weapons]
pistol = 12
submachine_gun = 30
sniper = 5
shotgun = 6
he_grenade = 6

[ammo]
pistol_rounds = 120
smg_rounds = 300
sniper_rounds = 30
shotgun_shells = 48
he_grenades = 0

# Owned item IDs or skill:<ID> references registered in skills.toml.
[hotbar]
0 = "pistol"
1 = "submachine_gun"
2 = "shotgun"
3 = "sniper"
4 = "he_grenade"
5 = "skill:punch"

# Item top-left positions in storage cells. References must name equipped gear.
[placements.pistol]
storage = "body/hip_holster/holster"
x = 0
y = 0

[placements.he_grenade]
storage = "body/chest_pouch/pouch"
x = 0
y = 0

[placements.submachine_gun]
storage = "backpack/tactical_backpack/main"
x = 0
y = 0

[placements.shotgun]
storage = "backpack/tactical_backpack/main"
x = 3
y = 0

[placements.sniper]
storage = "backpack/tactical_backpack/main"
x = 0
y = 2
