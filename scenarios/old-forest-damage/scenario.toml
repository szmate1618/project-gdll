version = 4
seed = 42

# Hand-picked from forest_patches.json, original orthophoto forest patch
# northeast_north_e+01_n+05_01. That patch spans east 500..1000 m,
# north 2500..2932.735 m. Runtime Z is negative north.
# Use --vegetation orthophoto to load this original forest data.
[player]
spawn = [700.0, -2700.0]
# Degrees: yaw -90 faces north (-Z), pitch 0 looks level.
orientation = [-90.0, 0.0]

[zombies.damage_targets]
count = 100
movement = "travel"
# Start 100..120 m ahead, then walk south toward and past the player.
# Destinations 100..150 m behind the player give roughly 200..270 m walks.
# Both rectangles and the player are inside the same forest patch above.
spawn = [688.0, -2820.0, 712.0, -2800.0]
destination = [688.0, -2600.0, 712.0, -2550.0]
